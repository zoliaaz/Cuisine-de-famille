<style>
:root{
  --bg:#fbf6ee; --card:#fffdf9; --ink:#3a2a20; --mute:#8a7566; --line:#eadfce;
  --acc:#b5562f; --acc2:#e9c9a8; --accSoft:#f6e6d6; --ok:#4f7a4a; --danger:#b23a3a;
  --r:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,sans-serif;font-size:19px;line-height:1.45}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:700;margin:0;line-height:1.15}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:980px;margin:0 auto;padding:18px 18px 120px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.top h1{font-size:30px;flex:1}
.top .sub{font-family:Fraunces,serif;font-style:italic;color:var(--mute);font-size:17px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:56px;padding:0 22px;border-radius:999px;font-weight:800;font-size:19px;background:var(--card);border:2px solid var(--line)}
.btn.primary{background:var(--acc);color:#fff;border-color:var(--acc)}
.btn.soft{background:var(--accSoft);border-color:var(--acc2);color:var(--acc)}
.btn.danger{color:var(--danger);border-color:#e7c3c3}
.btn.big{min-height:68px;font-size:21px;padding:0 30px}
.btn:active{transform:scale(.97)}
.btn[disabled]{opacity:.45;pointer-events:none}
.iconbtn{width:52px;height:52px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:24px;background:var(--card);border:2px solid var(--line);flex:none}
.iconbtn:active{transform:scale(.94)}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.hidden{display:none!important}
.notice{background:var(--accSoft);border:2px dashed var(--acc2);border-radius:var(--r);padding:16px 18px;margin:12px 0;color:var(--ink)}
.muted{color:var(--mute)}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{min-height:50px;padding:0 18px;border-radius:999px;background:var(--card);border:2px solid var(--line);font-weight:700;font-size:18px;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.chip.has{background:var(--accSoft);border-color:var(--acc2);color:var(--acc)}
.chip.small{min-height:42px;font-size:16px;padding:0 14px}

/* home */
.cats{margin:6px 0 16px}
.search{width:100%;min-height:56px;border-radius:999px;border:2px solid var(--line);background:var(--card);padding:0 22px;font-size:19px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.rcard{background:var(--card);border:2px solid var(--line);border-radius:var(--r);overflow:hidden;text-align:left;display:flex;flex-direction:column}
.rcard .ph{aspect-ratio:4/3;background:var(--accSoft) center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-size:46px}
.rcard .tx{padding:12px 14px 14px}
.rcard h3{font-size:20px}
.rcard .cat{font-size:14px;font-weight:800;color:var(--acc);text-transform:uppercase;letter-spacing:.06em}
.empty{text-align:center;padding:40px 10px}
.empty .big{font-size:64px}

/* editor */
.sec{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:20px;margin-bottom:18px}
.sec h2{font-size:24px;display:flex;align-items:center;gap:10px;margin-bottom:14px}
.sec h2 .n{width:38px;height:38px;border-radius:50%;background:var(--acc);color:#fff;font-family:Nunito;font-size:19px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.lbl{font-weight:800;margin:14px 0 8px;display:block}
.tinput{width:100%;min-height:60px;border-radius:14px;border:2px solid var(--line);background:#fff;padding:10px 16px;font-size:21px}
.tinput.title{font-family:Fraunces,serif;font-size:26px}
.tinput:focus,textarea:focus,.search:focus{outline:none;border-color:var(--acc)}
textarea.tinput{min-height:90px;resize:none;line-height:1.4;font-size:19px}
.err{border-color:var(--danger)!important;background:#fff5f5}
.stepper{display:inline-flex;align-items:center;gap:8px}
.stepper .val{min-width:64px;text-align:center;font-weight:800;font-size:22px}
.stepper input{width:84px;text-align:center;min-height:52px;border-radius:12px;border:2px solid var(--line);font-weight:800;font-size:20px;background:#fff}

.chosen{display:flex;flex-direction:column;gap:10px;margin-bottom:14px}
.ingrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--bg);border:2px solid var(--line);border-radius:16px;padding:8px 10px 8px 16px}
.ingrow .nm{flex:1 1 180px;font-weight:800;font-size:20px}
.ingrow select{min-height:52px;border-radius:12px;border:2px solid var(--line);background:#fff;padding:0 10px;font-weight:700;font-size:18px;max-width:170px}
.ingrow.flash{animation:fl .9s}
@keyframes fl{0%,100%{background:var(--bg)}30%{background:var(--acc2)}}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{white-space:nowrap;min-height:46px;padding:0 16px;border-radius:12px;font-weight:800;color:var(--mute);background:transparent;border:2px solid transparent}
.tab.on{color:var(--acc);background:var(--accSoft);border-color:var(--acc2)}
.palette{max-height:330px;overflow-y:auto;padding:4px 2px}
.addown{display:flex;gap:10px;margin-top:14px}
.addown input{flex:1}

.cuis{border:2px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px;background:var(--bg)}
.cuis .head{display:flex;align-items:center;margin-bottom:6px}
.cuis .head b{flex:1;font-size:19px}
.duree{font-family:Fraunces,serif;font-size:30px;min-width:120px;display:inline-block;text-align:center}
.tempv{font-family:Fraunces,serif;font-size:26px;min-width:150px;display:inline-block;text-align:center}

.etape{display:flex;gap:12px;align-items:flex-start;margin-bottom:12px}
.etape .num{width:44px;height:44px;border-radius:50%;background:var(--acc);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none;margin-top:8px;font-size:20px}
.etape .body{flex:1}
.etape .tools{display:flex;flex-direction:column;gap:6px}
.etape .tools .iconbtn{width:46px;height:46px;font-size:20px}
.fieldwrap{position:relative}
.photozone{border:3px dashed var(--acc2);border-radius:20px;min-height:200px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;background:var(--bg);overflow:hidden;text-align:center;padding:16px}
.photozone img{max-width:100%;max-height:420px;border-radius:14px;display:block}
.hint{font-size:16px;color:var(--mute);margin:6px 0 0}

.savebar{position:fixed;left:0;right:0;bottom:0;background:rgba(251,246,238,.96);border-top:2px solid var(--line);padding:12px 18px;backdrop-filter:blur(6px);z-index:20}
.savebar .in{max-width:980px;margin:0 auto;display:flex;gap:12px;align-items:center}

/* fiche */
.hero{width:100%;max-height:480px;object-fit:cover;border-radius:22px;display:block;margin-bottom:18px}
.fiche h1{font-size:36px;margin:6px 0 4px}
.fiche .cat{font-weight:800;color:var(--acc);text-transform:uppercase;letter-spacing:.08em;font-size:15px}
.cols{display:grid;grid-template-columns:1fr 1.5fr;gap:18px;margin-top:16px}
@media (max-width:760px){.cols{grid-template-columns:1fr}}
.fiche ul{padding-left:22px;margin:8px 0}
.fiche li{margin:6px 0}
.fiche ol{padding-left:0;list-style:none;counter-reset:e;margin:8px 0}
.fiche ol li{counter-increment:e;position:relative;padding-left:52px;margin:12px 0;min-height:40px}
.fiche ol li::before{content:counter(e);position:absolute;left:0;top:-2px;width:38px;height:38px;border-radius:50%;background:var(--acc);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center}
.cbox{background:var(--accSoft);border-radius:16px;padding:12px 16px;margin:8px 0}
.mot{font-family:Fraunces,serif;font-style:italic;font-size:21px;border-left:5px solid var(--acc2);padding:6px 0 6px 16px;margin-top:18px}

/* livret */
.lrow{display:flex;align-items:center;gap:14px;padding:10px 4px;border-bottom:1px solid var(--line);font-size:19px}
.lrow input{width:28px;height:28px;accent-color:var(--acc)}
.lcat{font-family:Fraunces,serif;font-size:21px;color:var(--acc);margin:16px 0 4px}

/* dialog + toast */
.veil{position:fixed;inset:0;background:rgba(58,42,32,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.dlg{background:var(--card);border-radius:24px;padding:26px;max-width:480px;width:100%}
.dlg h3{font-size:24px;margin-bottom:10px}
.dlg .row{margin-top:22px;justify-content:flex-end}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:14px 24px;border-radius:999px;font-weight:700;z-index:60;max-width:90vw;text-align:center}
.banner{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:#fff4e5;border:2px solid #f0c27a;border-radius:var(--r);padding:14px 18px;margin:0 0 16px}
.banner .t{flex:1 1 260px;font-weight:700}
.banner.ok{background:#eef5ec;border-color:#bcd6b6}
.save-sec{margin-top:34px}
.save-sec .st{font-weight:700;margin-bottom:12px}
</style>
</head>

/* ================= Stockage sur la tablette (IndexedDB) ================= */
const store = (()=>{
  let dbp=null;
  function open(){ if(dbp) return dbp; dbp=new Promise((res,rej)=>{ const r=indexedDB.open("carnet-recettes",1);
    r.onupgradeneeded=()=>{ const d=r.result; d.createObjectStore("recettes",{keyPath:"id"}); d.createObjectStore("photos"); d.createObjectStore("meta"); };
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); return dbp; }
  async function tx(name,mode,fn){ const d=await open(); return new Promise((res,rej)=>{ const t=d.transaction(name,mode); const s=t.objectStore(name); let out; const r=fn(s); if(r) r.onsuccess=()=>{out=r.result;}; t.oncomplete=()=>res(out); t.onerror=()=>rej(t.error); t.onabort=()=>rej(t.error); }); }
  return {
    all:()=>tx("recettes","readonly",s=>s.getAll()),
    put:r=>tx("recettes","readwrite",s=>s.put(r)),
    del:id=>tx("recettes","readwrite",s=>s.delete(id)),
    getPhoto:id=>tx("photos","readonly",s=>s.get(id)),
    putPhoto:(id,v)=>tx("photos","readwrite",s=>s.put(v,id)),
    delPhoto:id=>tx("photos","readwrite",s=>s.delete(id)),
    getMeta:k=>tx("meta","readonly",s=>s.get(k)),
    setMeta:(k,v)=>tx("meta","readwrite",s=>s.put(v,k)),
    async replaceAll(data){ const d=await open(); return new Promise((res,rej)=>{ const t=d.transaction(["recettes","photos","meta"],"readwrite");
      const R=t.objectStore("recettes"),P=t.objectStore("photos"),M=t.objectStore("meta"); R.clear(); P.clear();
      (data.recettes||[]).forEach(r=>{ const {photo,...rest}=r; R.put(rest); if(photo) P.put(photo,r.id); });
      if(data.livre) M.put(data.livre,"livre"); if(data.perso) M.put(data.perso,"perso");
      t.oncomplete=()=>res(); t.onerror=()=>rej(t.error); }); }
  };
})();
const newId=()=> (crypto.randomUUID? crypto.randomUUID(): Date.now().toString(36)+Math.random().toString(36).slice(2,10));

/* ================= État ================= */
let recettes=[], loaded=false, storageError=false;

let perso=[];

let ed=null, ficheId=null, ficheServ=null;
let palTab="Épicerie", palSearch="";
const photoCache={};
// sauvegarde

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const lcFirst=s=>s? s.charAt(0).toLowerCase()+s.slice(1):s;
function toast(t,ms=2600){const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),ms);}
function ask(title,text,okLbl,danger){return new Promise(res=>{const v=document.createElement("div");v.className="veil";v.innerHTML=`<div class="dlg"><h3>${esc(title)}</h3><div>${esc(text)}</div><div class="row"><button class="btn" data-a="0">Annuler</button><button class="btn ${danger?'danger':'primary'}" data-a="1">${esc(okLbl)}</button></div></div>`;v.onclick=e=>{const a=e.target.closest("[data-a]");if(a||e.target===v){v.remove();res(a&&a.dataset.a==="1");}};document.body.appendChild(v);});}
function downloadBlob(blob,name){ const u=URL.createObjectURL(blob); const a=document.createElement("a"); a.href=u; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),30000); }
function ago(t){ if(!t) return "jamais"; const s=(Date.now()-t)/1000; if(s<60) return "à l'instant"; if(s<3600) return `il y a ${Math.round(s/60)} min`; if(s<86400) return `il y a ${Math.round(s/3600)} h`; const d=Math.round(s/86400); return d===1?"hier":`il y a ${d} jours`; }

/* ================= Formats ================= */
function roundQ(q,u){ if(u==="g"||u==="cl"){ if(q>=100) return Math.round(q/5)*5; return Math.round(q); } return Math.round(q*4)/4; }
function fmtQ(q){ if(q==null||q===""||!isFinite(+q)) return ""; q=+q; const i=Math.floor(q), f=Math.round((q-i)*100)/100;
  const m={0.25:"¼",0.5:"½",0.75:"¾"}; if(f===0) return String(i); if(m[f]) return (i? i+" ":"")+m[f]; return String(Math.round(q*100)/100).replace(".",","); }
function qInput(q){ if(q==null) return ""; return String(Math.round(q*100)/100).replace(".",","); }
function unitTxt(u,q){ return (PLURAL.has(u)&&q>1)? u+"s":u; }
function ingLine(it,f=1){
  const n=it.nom||""; const u=it.unite;
  if(u==="selon goût") return n+", selon le goût";
  if(it.qte==null||it.qte===""||+it.qte===0) return n;
  const q=roundQ(+it.qte*f,u), qs=fmtQ(q);
  if(!u||u==="pièce") return qs+" "+lcFirst(n);
  const de=/^[aeiouyhâàéèêëîïôöûüœ]/i.test(n)?"d'":"de ";
  return `${qs} ${unitTxt(u,q)} ${de}${lcFirst(n)}`;
}
function durTxt(h,m){h=+h||0;m=+m||0; if(h&&m) return `${h} h ${String(m).padStart(2,"0")}`; if(h) return `${h} h`; if(m) return `${m} min`; return "";}
function cuisTxt(c){ const p=[c.mode]; if(c.mode==="Four"){ if(c.chaleur) p.push(lcFirst(c.chaleur)); if(c.temp) p.push(`${c.temp} °C (th. ${Math.round(c.temp/30)})`);} else if(c.feu && PLAQUE.has(c.mode)) p.push("feu "+lcFirst(c.feu)); const d=durTxt(c.h,c.min); if(d) p.push(d); return p.join(" · "); }
function sorted(list){ return [...list].sort((a,b)=>{const ca=CATS.indexOf(a.categorie), cb=CATS.indexOf(b.categorie); if(ca!==cb) return (ca<0?99:ca)-(cb<0?99:cb); return (a.titre||"").localeCompare(b.titre||"","fr");}); }

/* ================= Images ================= */
function loadImg(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src;});}
async function toJpeg(src,maxDim,maxChars){
  const img=await loadImg(src); let dim=maxDim,q=0.82,out="";
  for(let k=0;k<12;k++){ const s=Math.min(1,dim/Math.max(img.naturalWidth,img.naturalHeight));
    const c=document.createElement("canvas"); c.width=Math.round(img.naturalWidth*s); c.height=Math.round(img.naturalHeight*s);
    const x=c.getContext("2d"); x.fillStyle="#fff"; x.fillRect(0,0,c.width,c.height); x.drawImage(img,0,0,c.width,c.height);
    out=c.toDataURL("image/jpeg",q); if(out.length<=maxChars) break; if(q>0.6) q-=0.08; else dim=Math.round(dim*0.85); }
  return out;
}
async function getPhoto(id){ if(photoCache[id]!==undefined) return photoCache[id]; try{ photoCache[id]=(await store.getPhoto(id))||null; }catch(e){ return null; } return photoCache[id]; }

/* ================= Sauvegarde ================= */
const canPickDir = "showDirectoryPicker" in window;
const canPickFile = "showSaveFilePicker" in window;
async function initBackup(){
  bk.last=await store.getMeta("lastBackup").catch(()=>null);
  bk.pending=(await store.getMeta("pending").catch(()=>0))||0;
  bk.handle=await store.getMeta("handle").catch(()=>null);
  if(bk.handle && bk.handle.queryPermission){
    try{ const p=await bk.handle.queryPermission({mode:"readwrite"}); bk.state= p==="granted"?"ok":"needperm"; }catch(e){ bk.state="needperm"; }
  } else bk.state=(canPickDir||canPickFile)?"none":"unsupported";
}
async function buildBackup(){
  const list=await store.all(); const out=[];
  for(const r of list){ const p=r.aPhoto? await getPhoto(r.id):null; out.push(p?{...r,photo:p}:r); }
  return JSON.stringify({app:"carnet-recettes",version:1,date:new Date().toISOString(),livre,perso,recettes:out});
}
async function writeTo(handle,name,json){
  let fh=handle;
  if(handle.kind==="directory") fh=await handle.getFileHandle(name,{create:true});
  const w=await fh.createWritable(); await w.write(json); await w.close();
}
let bkTimer=null, bkRunning=false;
async function noteChange(){ bk.pending++; store.setMeta("pending",bk.pending).catch(()=>{}); scheduleBackup(); }
function scheduleBackup(){ clearTimeout(bkTimer); bkTimer=setTimeout(runBackup,1500); }
async function runBackup(){
  if(bk.state!=="ok"||bkRunning) return; bkRunning=true;
  try{
    const json=await buildBackup();
    await writeTo(bk.handle,BACKUP_MAIN,json);
    if(bk.handle.kind==="directory"){ const d=new Date(); await writeTo(bk.handle,`carnet-recettes-${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}.json`,json); }
    bk.last=Date.now(); bk.pending=0; await store.setMeta("lastBackup",bk.last); await store.setMeta("pending",0);
  }catch(e){
    if(e&&(e.name==="NotAllowedError"||e.name==="SecurityError")) bk.state="needperm";
    else if(e&&e.name==="NotFoundError"){ bk.state="none"; bk.handle=null; store.setMeta("handle",null).catch(()=>{}); }
    console.warn("sauvegarde",e);
  }
  bkRunning=false; if(view==="home") renderHome();
}
async function chooseFolder(){
  try{
    let h;
    if(canPickDir) h=await window.showDirectoryPicker({id:"carnet-recettes",mode:"readwrite",startIn:"documents"});
    else h=await window.showSaveFilePicker({suggestedName:BACKUP_MAIN,types:[{description:"Sauvegarde du carnet",accept:{"application/json":[".json"]}}]});
    bk.handle=h; bk.state="ok"; await store.setMeta("handle",h);
    await runBackup(); toast("Sauvegarde automatique activée ✔");
  }catch(e){ if(e&&e.name!=="AbortError"){ toast("Ce dossier ne peut pas être utilisé. Essayez « Documents ».",4000); console.warn(e);} }
  renderHome();
}
async function reactivate(){
  try{ const p=await bk.handle.requestPermission({mode:"readwrite"}); if(p==="granted"){ bk.state="ok"; await runBackup(); toast("Sauvegarde réactivée ✔"); } }catch(e){ bk.state="none"; }
  renderHome();
}
async function manualBackup(){
  try{ const json=await buildBackup(); const d=new Date().toISOString().slice(0,10);
    downloadBlob(new Blob([json],{type:"application/json"}),`carnet-recettes-${d}.json`);
    if(bk.state!=="ok"){ bk.last=Date.now(); bk.pending=0; await store.setMeta("lastBackup",bk.last); await store.setMeta("pending",0); }
    toast("Sauvegarde enregistrée dans « Téléchargements »",3500); renderHome();
  }catch(e){ toast("La sauvegarde n'a pas marché."); }
}
async function restoreFile(file){
  try{
    const data=JSON.parse(await file.text());
    if(data.app!=="carnet-recettes"||!Array.isArray(data.recettes)) throw new Error("format");
    const n=data.recettes.length;
    if(!(await ask("Restaurer cette sauvegarde ?",`Elle contient ${n} recette${n>1?"s":""}. Les recettes actuelles de la tablette seront remplacées.`,"Restaurer",true))) return;
    await store.replaceAll(data);
    Object.keys(photoCache).forEach(k=>delete photoCache[k]);
    await loadAll(); toast("Carnet restauré ✔"); noteChange();
  }catch(e){ toast("Ce fichier n'est pas une sauvegarde du carnet.",3500); }
}
async function loadAll(){
  try{
    recettes=await store.all();
    const l=await store.getMeta("livre"); if(l) livre={...livre,...l};
    perso=(await store.getMeta("perso"))||[];
  }catch(e){ storageError=true; }
  loaded=true; render();
}

/* ================= Navigation (bouton retour Android) ================= */
function go(v,opts={}){ view=v; if(v!=="home") history.pushState({v},""); render(); }
window.addEventListener("popstate",async()=>{
  if(view==="edit"&&ed&&ed.dirty){ const ok=await ask("Quitter sans enregistrer ?","Les changements de cette recette seront perdus.","Quitter",true); if(!ok){ history.pushState({v:"edit"},""); return; } }
  if(view==="edit"&&ed&&ed.id){ ficheId=ed.id; ed=null; view="fiche"; render(); return; }
  ed=null; view="home"; render();
});
function back(){ history.back(); }

/* ================= Accueil ================= */
function render(){ if(view==="home") renderHome(); else if(view==="edit") renderEdit(); else if(view==="fiche") renderFiche(); else if(view==="livret") renderLivret(); window.scrollTo(0,0); }
function backupBanner(){
  if(!recettes.length && bk.state!=="needperm") return "";
  if(bk.state==="needperm") return `<div class="banner"><span class="t">⚠️ La sauvegarde automatique est en pause.</span><button class="btn primary" id="bkre">Réactiver</button></div>`;
  if(bk.state==="none") return `<div class="banner"><span class="t">💾 Choisissez un dossier de la tablette pour sauvegarder les recettes automatiquement.</span><button class="btn primary" id="bkpick">Choisir le dossier</button></div>`;
  if(bk.state==="unsupported" && bk.pending>0) return `<div class="banner"><span class="t">💾 Pensez à sauvegarder : ${bk.pending} changement${bk.pending>1?"s":""} depuis la dernière sauvegarde.</span><button class="btn primary" id="bkdl">Sauvegarder</button></div>`;
  return "";
}

    : bk.state==="needperm" ? "⚠️ Sauvegarde automatique en pause" : bk.state==="none" ? "Pas encore de dossier de sauvegarde" : `Dernière sauvegarde : ${ago(bk.last)}`;
  $("#app").innerHTML=`
   <div class="top"><div style="flex:1"><h1>${esc(livre.titre)}</h1><div class="sub">${esc(livre.sousTitre)}</div></div></div>
   ${storageError?`<div class="notice">Le navigateur refuse d'enregistrer des données (navigation privée ?). Ouvrez l'appli normalement dans Chrome.</div>`:""}
   ${backupBanner()}
   <div class="row" style="margin-bottom:18px">
     <button class="btn primary big" id="new">＋ Nouvelle recette</button>
     <span class="spacer"></span>
     <button class="btn soft" id="book" ${recettes.length?"":"disabled"}>📖 Faire le livret</button>
   </div>
   ${recettes.length>3?`<input class="search" id="q" placeholder="🔍 Chercher une recette ou un ingrédient" value="${esc(searchTxt)}">`:""}
   ${usedCats.length>1?`<div class="chips cats"><button class="chip small ${!filterCat?"on":""}" data-cat="">Toutes</button>${usedCats.map(c=>`<button class="chip small ${filterCat===c?"on":""}" data-cat="${esc(c)}">${CAT_EMOJI[c]} ${esc(c)}</button>`).join("")}</div>`:""}
   ${!loaded?`<p class="muted">Chargement…</p>`:
     recettes.length===0?`<div class="empty"><div class="big">👩‍🍳</div><h2>Le carnet est encore vide</h2><p class="muted">Appuyez sur « Nouvelle recette » pour écrire la première.</p></div>`:
     `<div class="grid">${list.map(r=>`<button class="rcard" data-id="${esc(r.id)}"><div class="ph" style="${r.vignette?`background-image:url('${r.vignette}')`:""}">${r.vignette?"":CAT_EMOJI[r.categorie]||"📒"}</div><div class="tx"><div class="cat">${esc(r.categorie||"")}</div><h3>${esc(r.titre||"Sans nom")}</h3></div></button>`).join("")}</div>
      ${list.length===0?`<p class="muted">Aucune recette ne correspond.</p>`:""}`}
   ${loaded?`<div class="sec save-sec"><h2>💾 Sauvegarde</h2><div class="st">${bkTxt}</div>
     <div class="row">
       ${(canPickDir||canPickFile)?`<button class="btn" id="bkpick2">${bk.handle?"Changer de dossier":"Choisir le dossier"}</button>`:""}
       <button class="btn" id="bkdl2" ${recettes.length?"":"disabled"}>⬇ Sauvegarde manuelle</button>
       <button class="btn" id="bkrs">↺ Restaurer</button>
     </div>
     <p class="hint">Le fichier de sauvegarde contient toutes les recettes et les photos. Copiez-le de temps en temps ailleurs (clé USB, ordinateur…) : si la tablette est perdue, il permet de tout récupérer.</p></div>`:""}
  `;
  const on=(id,f)=>{const e=$(id); if(e) e.onclick=f;};
  on("#new",()=>openEditor(null)); on("#book",()=>go("livret"));
  on("#bkre",reactivate); on("#bkpick",chooseFolder); on("#bkpick2",chooseFolder); on("#bkdl",manualBackup); on("#bkdl2",manualBackup);
  on("#bkrs",()=>{const i=$("#restoreInput"); i.value=""; i.click();});
  const q=$("#q"); if(q){q.oninput=()=>{searchTxt=q.value;const p=q.selectionStart;renderHome();const n=$("#q");n.focus();n.setSelectionRange(p,p);};}
  document.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{filterCat=b.dataset.cat||null;renderHome();});
  document.querySelectorAll(".rcard").forEach(b=>b.onclick=()=>{ficheId=b.dataset.id;ficheServ=null;go("fiche");});

$("#restoreInput").onchange=e=>{const f=e.target.files[0]; if(f) restoreFile(f);};

/* ================= Fiche ================= */
async function renderFiche(){
  const r=recettes.find(x=>x.id===ficheId); if(!r){view="home";return render();}
  const base=+r.portions||0; if(ficheServ==null) ficheServ=base; const f= base? ficheServ/base:1;
  $("#bar").innerHTML="";
  $("#app").innerHTML=`
   <div class="row" style="margin-bottom:14px"><button class="btn" id="back">← Retour</button><span class="spacer"></span><button class="btn soft" id="edit">✏️ Modifier</button></div>
   <div class="fiche">
    <div id="hero"></div>
    <div class="cat">${CAT_EMOJI[r.categorie]||""} ${esc(r.categorie||"")}</div>
    <h1>${esc(r.titre)}</h1>
    ${base?`<div class="row" style="margin-top:8px"><span>Pour</span><span class="stepper"><button class="iconbtn" id="sm">−</button><span class="val">${ficheServ}</span><button class="iconbtn" id="sp">＋</button></span><span>personne${ficheServ>1?"s":""}</span></div>`:""}
    <div class="cols">
      <div class="sec"><h2>Ingrédients</h2><ul>${(r.ingredients||[]).map(i=>`<li>${esc(ingLine(i,f))}</li>`).join("")||"<li class='muted'>—</li>"}</ul></div>
      <div>
        ${(r.cuissons||[]).length?`<div class="sec"><h2>Cuisson</h2>${r.cuissons.map(c=>`<div class="cbox"><b>${MODE_EMOJI[c.mode]||""} ${esc(cuisTxt(c))}</b>${c.remarque?`<div>${esc(c.remarque)}</div>`:""}</div>`).join("")}</div>`:""}
        <div class="sec"><h2>Préparation</h2><ol>${(r.etapes||[]).map(e=>`<li>${esc(e)}</li>`).join("")}</ol></div>
      </div>
    </div>
    ${r.mot?`<div class="mot">« ${esc(r.mot)} »</div>`:""}
   </div>`;
  $("#back").onclick=back;
  $("#edit").onclick=()=>openEditor(r.id);
  $("#sm")&&($("#sm").onclick=()=>{if(ficheServ>1){ficheServ--;keep();}});
  $("#sp")&&($("#sp").onclick=()=>{ficheServ++;keep();});
  if(r.aPhoto){ const p=await getPhoto(r.id); const h=$("#hero"); if(p&&h&&view==="fiche"&&ficheId===r.id) h.innerHTML=`<img class="hero" src="${p}" alt="">`; }
}
function keep(){const y=window.scrollY; renderFiche().then(()=>window.scrollTo(0,y)); window.scrollTo(0,y);}

/* ================= Éditeur ================= */
function blankCuis(){return {mode:"",chaleur:"",temp:180,feu:"",h:0,min:0,remarque:""};}
function blank(){return {titre:"",categorie:"Plat",portions:4,ingredients:[],cuissons:[blankCuis()],etapes:[""],mot:""};}
async function openEditor(id){
  if(id){ const r=recettes.find(x=>x.id===id); const d=JSON.parse(JSON.stringify(r)); delete d.id;
    if(!d.cuissons||!d.cuissons.length) d.cuissons=[blankCuis()]; if(!d.etapes||!d.etapes.length) d.etapes=[""];
    ed={id,data:d,photo:{state:r.aPhoto?"keep":"none",url:null},dirty:false};
    go("edit"); if(r.aPhoto){ ed.photo.url=await getPhoto(id); renderPhoto(); }
  } else { ed={id:null,data:blank(),photo:{state:"none",url:null},dirty:false}; go("edit"); }
}
function dirty(){ if(ed) ed.dirty=true; }

let saving=false, persistAsked=false;
async function save(){
  if(saving) return; const d=ed.data;
  if(!d.titre.trim()){ const t=$("#titre"); t.classList.add("err"); t.scrollIntoView({block:"center",behavior:"smooth"}); t.focus(); toast("Il manque le nom de la recette."); return; }
  saving=true; const btn=$("#save"); btn.disabled=true; $("#savest").textContent="Enregistrement…";
  try{
    const id=ed.id||newId();
    const out={ id, titre:d.titre.trim(), categorie:d.categorie||"Autre", portions:+d.portions||null,
      ingredients:d.ingredients.map(i=>({nom:i.nom,qte:i.qte==null?null:+i.qte,unite:i.unite})),
      cuissons:d.cuissons.filter(c=>c.mode).map(c=>({mode:c.mode,chaleur:c.mode==="Four"?c.chaleur||"":"",temp:c.mode==="Four"?+c.temp||null:null,feu:PLAQUE.has(c.mode)?c.feu||"":"",h:+c.h||0,min:+c.min||0,remarque:(c.remarque||"").trim()})),
      etapes:d.etapes.map(e=>e.trim()).filter(Boolean), mot:(d.mot||"").trim(),
      aPhoto:ed.photo.state!=="none", vignette:d.vignette||"", creeLe:d.creeLe||Date.now(), modifieLe:Date.now() };
    if(ed.photo.state==="new"){ out.vignette=await toJpeg(ed.photo.url,420,45000); await store.putPhoto(id,ed.photo.url); photoCache[id]=ed.photo.url; }
    if(ed.photo.state==="none"){ out.vignette=""; await store.delPhoto(id).catch(()=>{}); photoCache[id]=null; }
    await store.put(out);
    const i=recettes.findIndex(r=>r.id===id); if(i>=0) recettes[i]=out; else recettes.push(out);
    if(!persistAsked&&navigator.storage&&navigator.storage.persist){ persistAsked=true; navigator.storage.persist().catch(()=>{}); }
    noteChange();
    ed=null; toast("Recette enregistrée ✔"); ficheId=id; ficheServ=null;
    view="fiche"; history.replaceState({v:"fiche"},""); render();
  }catch(e){
    console.error(e); toast(e&&e.name==="QuotaExceededError"?"La tablette n'a plus de place.":"L'enregistrement n'a pas marché. Réessayez.",4000);
    $("#savest").textContent=""; btn.disabled=false;
  } finally{ saving=false; }
}
async function delRecipe(){

const P=s=>String(s??"").replace(/œ/g,"oe").replace(/Œ/g,"Oe").replace(/[’‘]/g,"'").replace(/[“”]/g,'"').replace(/[–—]/g,"-").replace(/…/g,"...").replace(/ | /g," ").replace(/[^\x00-\xFF]/g,"");
async function genPdf(){
  const st=$("#lst"), btn=$("#gen");

  if(!sel.length){toast("Cochez au moins une recette.");return;}
  if(!window.jspdf){toast("Le créateur de PDF n'est pas chargé : connectez la tablette à internet puis réessayez.",4500);return;}
  btn.disabled=true; st.textContent="Préparation du livret…";

    const {jsPDF}=window.jspdf; const doc=new jsPDF({unit:"mm",format:"a5"});

    color(ACC); doc.setFont("times","bolditalic"); doc.setFontSize(30);
    const tl=doc.splitTextToSize(P(livre.titre||"Recettes de famille"),CW-10); let cy=78-(tl.length-1)*6;
    tl.forEach(l=>{doc.text(l,W/2,cy,{align:"center"});cy+=12;});
    doc.setLineWidth(0.5); doc.line(W/2-18,cy-2,W/2+18,cy-2);
    if(livre.sousTitre){ color(INK); doc.setFont("times","italic"); doc.setFontSize(15); doc.text(P(livre.sousTitre),W/2,cy+9,{align:"center"}); }
    if(livre.dedicace){ color(MUTE); doc.setFont("times","italic"); doc.setFontSize(11); const dl2=doc.splitTextToSize(P(livre.dedicace),CW-20); let dy=H-40-(dl2.length-1)*5; dl2.forEach(l=>{doc.text(l,W/2,dy,{align:"center"});dy+=5.2;}); }
    // sommaire : pages réservées
    const cats=[...new Set(sel.map(r=>r.categorie))]; const perPage=24; const tocPages=Math.max(1,Math.ceil((sel.length+cats.length)/perPage));
    for(let i=0;i<tocPages;i++) doc.addPage();
    const startPage={};
    for(let k=0;k<sel.length;k++){
      const r=sel[k]; st.textContent=`Recette ${k+1} sur ${sel.length}…`;
      doc.addPage(); y=M; startPage[r.id]=doc.getNumberOfPages();
      color(ACC); doc.setFont("helvetica","bold"); doc.setFontSize(8); doc.text(P((r.categorie||"").toUpperCase()),M,y+2,{charSpace:0.6}); y+=8;
      color(INK); doc.setFont("times","bolditalic"); doc.setFontSize(21);
      doc.splitTextToSize(P(r.titre),CW).forEach(l=>{doc.text(l,M,y+3);y+=8.2;});
      if(r.portions){ color(MUTE); doc.setFont("helvetica","normal"); doc.setFontSize(9); doc.text(`Pour ${r.portions} personne${r.portions>1?"s":""}`,M,y+1); y+=5; }
      doc.setDrawColor(...ACC); doc.setLineWidth(0.4); doc.line(M,y,M+22,y); y+=6;
      if(r.aPhoto){ const p=await getPhoto(r.id); if(p){ try{ const im=await loadImg(p); let w=CW,h=w*im.naturalHeight/im.naturalWidth; const maxH=72; if(h>maxH){h=maxH;w=h*im.naturalWidth/im.naturalHeight;} doc.addImage(p,"JPEG",M+(CW-w)/2,y,w,h); y+=h+7; }catch(e){} } }
      const head=txt=>{ ensure(14); color(ACC); doc.setFont("times","bold"); doc.setFontSize(13); doc.text(P(txt),M,y+3); y+=8; };
      const ings=(r.ingredients||[]).map(i=>P(ingLine(i)));
      if(ings.length){ head("Ingrédients"); doc.setFont("helvetica","normal"); doc.setFontSize(9.5); color(INK);
        const two=ings.length>6; const colW=two?(CW-6)/2:CW; const half=two?Math.ceil(ings.length/2):ings.length;
        const cols=two?[ings.slice(0,half),ings.slice(half)]:[ings];
        const lines=cols.map(c=>c.map(s=>doc.splitTextToSize(s,colW-5)));
        const hOf=c=>c.reduce((a,l)=>a+l.length*4.3+0.8,0); const blockH=Math.max(...lines.map(hOf));

          const bh=4+l1.length*4.4+(l2.length?1+l2.length*4.3:0)+2.5; ensure(bh);

          y+=bh+3; });
        y+=2; }
      const es=r.etapes||[];
      if(es.length){ head("Préparation");
        es.forEach((e,i)=>{ doc.setFont("helvetica","normal"); doc.setFontSize(9.8); const ls=doc.splitTextToSize(P(e),CW-9);
          ensure(Math.min(ls.length,3)*4.6+2);
          color(ACC); doc.setFont("helvetica","bold"); doc.text(String(i+1)+".",M,y+3);
          color(INK); doc.setFont("helvetica","normal");
          ls.forEach(l=>{ if(y+4.6>bottom){doc.addPage();y=M;} doc.text(l,M+8,y+3); y+=4.6; }); y+=2.2; });
        y+=2; }
      if(r.mot){ doc.setFont("times","italic"); doc.setFontSize(11.5); const ls=doc.splitTextToSize(P("« "+r.mot+" »"),CW-8); ensure(Math.min(ls.length*5.2+2,40)+4); y+=2;
        let y0=y; color(INK); doc.setDrawColor(233,201,168); doc.setLineWidth(1.2);
        ls.forEach(l=>{ if(y+5.2>bottom){ doc.line(M+1,y0,M+1,y); doc.addPage(); y=M; y0=y; } doc.text(l,M+6,y+4); y+=5.2; });
        doc.line(M+1,y0,M+1,y+1); }
    }
    // sommaire
    let tp=2; doc.setPage(tp); y=M+4; color(ACC); doc.setFont("times","bolditalic"); doc.setFontSize(20); doc.text("Sommaire",W/2,y+4,{align:"center"}); y+=16; let n=0, cur=null;
    const tocLine=()=>{ n++; if(n>perPage){ tp++; doc.setPage(tp); y=M+6; n=1; } };
    sel.forEach(r=>{
      if(r.categorie!==cur){ cur=r.categorie; tocLine(); y+=2; color(ACC); doc.setFont("times","bold"); doc.setFontSize(12); doc.text(P(cur||""),M,y); y+=6.2; }
      tocLine(); color(INK); doc.setFont("helvetica","normal"); doc.setFontSize(10);
      let t=P(r.titre); while(doc.getTextWidth(t)>CW-22 && t.length>4) t=t.replace(/\.\.\.$/,"").slice(0,-1)+"...";
      const pg=String(startPage[r.id]); doc.text(t,M+3,y); doc.text(pg,W-M,y,{align:"right"});
      const x1=M+3+doc.getTextWidth(t)+2, x2=W-M-doc.getTextWidth(pg)-2; color(MUTE); let dots=""; while(doc.getTextWidth(dots+". ")<x2-x1) dots+=". "; doc.text(dots,x1,y);
      y+=6.2; });
    const total=doc.getNumberOfPages(); for(let i=2;i<=total;i++){ doc.setPage(i); color(MUTE); doc.setFont("times","italic"); doc.setFontSize(9); doc.text(String(i),W/2,H-8,{align:"center"}); }
    const name=(livre.titre||"livret").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-zA-Z0-9]+/g,"-").replace(/^-|-$/g,"").toLowerCase()||"livret";
    downloadBlob(doc.output("blob"),name+".pdf");
    st.textContent="Livret prêt : regardez dans « Téléchargements » ✔";
  }catch(e){ console.error(e); st.textContent="Le livret n'a pas pu être créé."; }
  btn.disabled=false;
}

history.replaceState({v:"home"},"");
render();

if("serviceWorker" in navigator && location.protocol==="https:") navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
